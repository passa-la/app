plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.passala.countdown'
version = '0.1.0'

android {
  namespace "com.passala.countdown"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.core:core:1.18.0"
}
